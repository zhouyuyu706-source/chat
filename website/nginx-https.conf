server {
    listen 80;
    listen [::]:80;
    server_name zova.38-60-203-167.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /data/zova/website; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zova.38-60-203-167.sslip.io;
    root /data/zova/website;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/zova.38-60-203-167.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zova.38-60-203-167.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https://d2ol7oe51mr4n9.cloudfront.net; media-src https://d8j0ntlcm91z4.cloudfront.net; font-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(zip|gz)$ { add_header Content-Disposition attachment; add_header X-Content-Type-Options nosniff; }
    access_log /www/wwwlogs/zova-website.log;
    error_log /www/wwwlogs/zova-website.error.log;
}
