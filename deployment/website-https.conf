limit_req_zone $binary_remote_addr zone=zova_names_rate:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=zova_names_conn:1m;
server {
    listen 80;
    listen [::]:80;
    server_name zova.38-60-203-167.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /data/zova/website; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zova.38-60-203-167.sslip.io;
    root /data/zova/website;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/zova.38-60-203-167.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zova.38-60-203-167.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https://d2ol7oe51mr4n9.cloudfront.net; media-src https://d8j0ntlcm91z4.cloudfront.net; font-src data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location ^~ /names/ {
        limit_req zone=zova_names_rate burst=10 nodelay;
        limit_req_status 429;
        limit_conn zova_names_conn 4;
        client_max_body_size 16k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8491/;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        access_log off;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(zip|gz|msi|apk)$ { add_header Content-Disposition attachment; add_header X-Content-Type-Options nosniff; }
    access_log /www/wwwlogs/zova-website.log;
    error_log /www/wwwlogs/zova-website.error.log;
}
