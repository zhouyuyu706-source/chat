limit_req_zone $binary_remote_addr zone=zova_dht_requests:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=zova_dht_connections:1m;
server {
    listen 80;
    server_name dht.zova.38-60-203-167.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /data/zova/website; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name dht.zova.38-60-203-167.sslip.io;
    ssl_certificate /etc/letsencrypt/live/dht.zova.38-60-203-167.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dht.zova.38-60-203-167.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_req zone=zova_dht_requests burst=80 nodelay;
        limit_conn zova_dht_connections 64;
        proxy_pass http://127.0.0.1:8480;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
    access_log off;
    error_log /www/wwwlogs/zova-dht.error.log warn;
}
